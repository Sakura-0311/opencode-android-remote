version: '3.8'

services:
  opencode-cloud:
    image: node:20-bookworm-slim
    container_name: opencode-cloud-server
    restart: unless-stopped
    ports:
      - "4096:4096"
    environment:
      - PORT=4096
      - HOSTNAME=0.0.0.0
      # 必填：部署前务必设置一个随机 token，例如：
      #   export OPENCODE_AUTH_TOKEN=$(openssl rand -hex 32)
      # 绝不要使用下面的默认值
      - OPENCODE_AUTH_TOKEN=${OPENCODE_AUTH_TOKEN:?请设置 OPENCODE_AUTH_TOKEN 环境变量}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - opencode-workspace:/workspace
    working_dir: /workspace
    command: >
      bash -c "
      apt-get update && apt-get install -y git curl python3 python3-pip &&
      npm install -g opencode &&
      opencode serve --port 4096 --hostname 0.0.0.0
      "

volumes:
  opencode-workspace:
    name: opencode_cloud_workspace
