version: '3.8'

services:
  opencode-cloud:
    image: node:20-bookworm-slim
    container_name: opencode-cloud-server
    restart: unless-stopped
    ports:
      - "4096:4096"
    environment:
      - PORT=4096
      - HOSTNAME=0.0.0.0
      # 强制要求用户提供强口令，避免弱口令导致未授权访问
      - OPENCODE_AUTH_TOKEN=${OPENCODE_AUTH_TOKEN:?必须设置 OPENCODE_AUTH_TOKEN 强口令，禁止使用默认密码}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - opencode-workspace:/workspace
    working_dir: /workspace
    command: >
      bash -c "
      apt-get update && apt-get install -y git curl python3 python3-pip &&
      npm install -g opencode &&
      opencode serve --port 4096 --hostname 0.0.0.0
      "

volumes:
  opencode-workspace:
    name: opencode_cloud_workspace
