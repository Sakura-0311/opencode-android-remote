services:
  caddy:
    image: caddy:2-alpine
    container_name: opencode-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - opencode-server
    networks:
      - opencode_net

  opencode-server:
    #  pin 到 digest（2026-10-05 查得 tag 2.0.23 对应 digest）：latest 浮动标签
    # 不可复现，升级时手动改 digest。caddy 仍用 2-alpine（官方维护的浮动小版本）。
    image: ghcr.io/anomalyco/opencode@sha256:2c74dc0dbdced56d069ec3d8be60c72157b04783a4f18c831c6b00a658764f81
    container_name: opencode-server
    restart: unless-stopped
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?Error: OPENCODE_SERVER_PASSWORD is required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    expose:
      - "4096"
    volumes:
      - ./workspace:/workspace
    networks:
      - opencode_net

networks:
  opencode_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
