name: OpenCode Remote CI & Release Build

on:
  push:
    branches: [ "main", "master", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Relay & Agent Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run Smoke Test Contract
        run: |
          pip install -r desktop_agent/requirements.txt
          pip install -r relay_server/requirements.txt
          python scripts/smoke_test_contract.py

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace
      # B-12: 同时构建正式签名 release 包
      - name: Build Release APK
        working-directory: android_app
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android_app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
