name: OpenCode Remote CI & Release Build

on:
  push:
    branches: [ "main", "master", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Relay & Agent Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'  # v4.2.0/O4: pip 依赖缓存提速
      - name: Run Smoke Test Contract
        run: |
          pip install -r desktop_agent/requirements.txt
          pip install -r relay_server/requirements.txt
          python scripts/smoke_test_contract.py
      - name: Run v3 Contract Tests
        # v3.0.2/B1: hello 协商 + 多 desktop 共存 + 主回退按最近认证时间
        run: |
          pip install uvicorn websockets
          python scripts/test_contract_v4.py

  supply-chain:
    # v2.6: 供应链安全——秘密扫描（仅 docs/，防文档泄密）与依赖漏洞扫描
    name: Supply chain security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
      - name: Scan docs for leaked secrets
        run: /tmp/gitleaks detect --source docs/ --no-git -v
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.0.3/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner && chmod +x /tmp/osv-scanner
      - name: Scan Python dependencies for CVEs
        run: /tmp/osv-scanner --recursive desktop_agent/requirements.txt relay_server/requirements.txt

  release-signing-failfast:
    # v2.2.1-D 验收：无 release 密钥时 assembleRelease 必须失败（不再静默降级 debug 签名）
    name: Release signing fail-fast check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: assembleRelease without keystore must fail
        working-directory: android_app
        run: |
          set +e
          out=$(gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1)
          code=$?
          echo "$out" | tail -5
          if [ $code -eq 0 ]; then
            echo "::error::assembleRelease 在无密钥时意外成功，fail-fast 失效"
            exit 1
          fi
          # 必须是我们的 fail-fast 文案，而不是配置错误等其他失败
          if echo "$out" | grep -q "v2.2.1-D: 缺少 release 签名密钥"; then
            echo "OK: assembleRelease correctly refused to build without release keystore"
          else
            echo "::error::assembleRelease 失败了，但不是预期的 fail-fast 文案"
            exit 1
          fi

  gen-verification-metadata:
    # v2.6: 手动触发，生成 gradle/verification-metadata.xml（依赖校验和锁定）。
    # 生成后下载提交到仓库，此后所有 Gradle 构建自动校验依赖完整性。
    name: Generate dependency verification metadata
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write verification metadata
        working-directory: android_app
        run: gradle --write-verification-metadata sha256 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintVitalAnalyzeRelease :app:cyclonedxBom --no-daemon --console=plain --stacktrace
      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: verification-metadata
          path: android_app/gradle/verification-metadata.xml
          if-no-files-found: error

  # v4.2.0/O4: Android 单测独立 job（v2.3 起在 android-build 内串行跑），
  # 与 android-build 并行，CI 总耗时缩短
  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      # 本地单测（Backoff / AppLog 脱敏 / Transport / Tink 等）
      - name: Run unit tests
        working-directory: android_app
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android_app/app/build/reports/tests/testDebugUnitTest/

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace
      # v2.2.1-D: 只有打 tag（v*）才构建 release 包；PR/分支推送只构建 debug
      # keystore 不再进仓库；CI 从 Secrets 恢复。tag 构建缺 Secret 即失败（fail-fast）
      - name: Restore release keystore from Secrets
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android_app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "keystore restored from secrets"
          else
            echo "::error::tag 构建缺少 RELEASE_KEYSTORE_BASE64 Secret，release 构建被拒绝"
            exit 1
          fi
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android_app
        env:
          # 注意：路径是相对 app module 目录（android_app/app/）的，keystore 已恢复到该目录
          RELEASE_KEYSTORE_FILE: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          # v2.2.1-D: release 产物名明确标注 signed，避免与 debug 包混淆
          name: app-release-signed
          path: android_app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # v2.6: SBOM（CycloneDX）随 release 产物发布
      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android_app
        run: |
          gradle :app:cyclonedxBom --no-daemon --console=plain --stacktrace
          ls -la app/build/reports/cyclonedx-bom.json
      - name: Scan SBOM for CVEs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.0.3/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner && chmod +x /tmp/osv-scanner
          # osv-scanner 按文件名识别 SBOM 格式，CycloneDX 需 .cdx.json 后缀
          cp android_app/app/build/reports/cyclonedx-bom.json /tmp/sbom-scan.cdx.json
          /tmp/osv-scanner --sbom=/tmp/sbom-scan.cdx.json
      - name: Upload SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-bom
          path: android_app/app/build/reports/cyclonedx-bom.json
          if-no-files-found: error
      # v2.6: release 产物附 checksums.txt
      - name: Write checksums.txt
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/release-files
          cp android_app/app/build/outputs/apk/release/app-release.apk /tmp/release-files/
          cp android_app/app/build/reports/cyclonedx-bom.json /tmp/release-files/
          (cd /tmp/release-files && sha256sum app-release.apk cyclonedx-bom.json > checksums.txt)
          cat /tmp/release-files/checksums.txt
          cp /tmp/release-files/checksums.txt android_app/app/build/outputs/apk/release/checksums.txt
      - name: Upload checksums
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: android_app/app/build/outputs/apk/release/checksums.txt
          if-no-files-found: error
      # v3.3: APK 体积回归检查（超 40MB 告警，不阻断）
      - name: APK size regression check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=android_app/app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "release APK size: $SIZE bytes"
          echo "apk_size_bytes=$SIZE" >> "$GITHUB_ENV"
          if [ "$SIZE" -gt 41943040 ]; then
            echo "::warning::release APK 超过 40MB 阈值（$SIZE bytes），请检查依赖膨胀"
          fi
      # v4.3.1 R-1: tag 发版前版本守卫——tag 必须与 appVersionName 一致，且不得复用已发布过的 tag
      - name: Verify tag matches versionName and tag is fresh
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          APP_VERSION=$(grep -oP 'appVersionName = "\K[^"]+' android_app/app/build.gradle.kts)
          echo "tag version: $TAG_VERSION / app version: $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag($TAG_VERSION) 与 appVersionName($APP_VERSION) 不一致，禁止发版"
            exit 1
          fi
          REPO="${GITHUB_REPOSITORY}"
          EXIST=$(curl -s -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -n "$EXIST" ]; then
            echo "::error::tag $TAG 已存在 release，禁止复用标签发版（请 bump 版本号）"
            exit 1
          fi
          echo "tag version guard passed"
      # v3.3: release 产物校验（签名指纹 / 包名 / versionCode 与 tag 一致）
      - name: Verify release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK=android_app/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "using build-tools: $BT"
          CERT_HEX=$( "$BT"/apksigner verify --print-certs "$APK" | grep "SHA-256 digest" | head -1 | awk '{print $NF}' )
          CERT_SHA256=$( echo "$CERT_HEX" | sed 's/\(..\)/\1:/g;s/:$//' | tr 'a-f' 'A-F' )
          echo "cert SHA-256: $CERT_SHA256"
          # v2.0 起固定签名，换签名即失败
          echo "$CERT_SHA256" | grep -qi "D9:21:C0:EB:AE:4A:DD:89:73:0B:BD:E7:49:1F:27:FD:26:41:95:0C:E1:19:1F:30:53:A3:E7:66:00:9E:9E:78" \
            || { echo "::error::签名指纹不匹配！"; exit 1; }
          PKG=$( "$BT"/aapt dump badging "$APK" | head -1 )
          echo "$PKG"
          echo "$PKG" | grep -q "package: name='com.opencode.android'" || { echo "::error::包名不匹配"; exit 1; }
          TAG="${GITHUB_REF#refs/tags/v}"
          EXPECT_CODE=$( echo "$TAG" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }' )
          echo "$PKG" | grep -q "versionCode='$EXPECT_CODE'" || { echo "::error::versionCode 与 tag 不一致（期望 $EXPECT_CODE）"; exit 1; }
          echo "$PKG" | grep -q "versionName='$TAG'" || { echo "::error::versionName 与 tag 不一致（期望 $TAG）"; exit 1; }
          echo "release artifact verified: $TAG / code $EXPECT_CODE"
      # v3.3: CI 报告（供下载）
      - name: Write CI report
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "# CI 报告（${GITHUB_REF#refs/tags/}）"
            echo ""
            echo "- release APK 大小： ${apk_size_bytes:-未知} bytes"
            echo "- 签名指纹： D9:21:C0:EB:AE:4A:DD:89:73:0B:BD:E7:49:1F:27:FD:26:41:95:0C:E1:19:1F:30:53:A3:E7:66:00:9E:9E:78（已校验）"
            echo "- R8： minify=true（v3.3 开启），shrinkResources=true（v4.2.0 开启）"
            echo "- 契约测试： python-tests job（19 项）"
            echo "- 依赖 CVE 扫描： supply-chain job（osv-scanner）"
          } > android_app/app/build/outputs/apk/release/ci-report.md
          cat android_app/app/build/outputs/apk/release/ci-report.md
      - name: Upload CI report
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: android_app/app/build/outputs/apk/release/ci-report.md
          if-no-files-found: error

  # v3.3: R8 release 包模拟器启动冒烟（防 R8/混淆导致启动闪退，沿用 v3.0.1 验证模式）
  emulator-smoke:
    name: Emulator smoke (R8 release APK)
    needs: android-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-signed
          path: /tmp/smoke-apk
      - name: Launch on emulator and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          # 注：runner 将 script 逐行以 sh -c 执行，故必须写成单行；变量跨行不保留
          script: |
            adb install /tmp/smoke-apk/app-release.apk && adb shell am start -n com.opencode.android/.MainActivity && sleep 30 && { adb logcat -d | grep -q "FATAL EXCEPTION" && { echo "::error::模拟器启动出现 FATAL 崩溃"; adb logcat -d | grep -A15 "FATAL EXCEPTION" | head -30; echo "FATAL_FOUND"; } || echo "NO_FATAL"; } | grep -q "NO_FATAL" && test -n "$(adb shell pidof com.opencode.android | tr -d '\r')" && echo "smoke OK：进程存活，无 FATAL"

  # C2: relay 一键部署文件校验（compose 语法 + healthcheck/自动重启配置存在）
  relay-compose-lint:
    name: Relay compose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cd relay_server
          docker compose config > /dev/null && echo "compose 语法 OK"
          docker compose config | grep -q "unless-stopped" && echo "自动重启 OK"
          docker compose config | grep -q "healthcheck:" && echo "healthcheck OK"
