name: E2E UI (Maestro golden path)

# B4: 端到端 UI 测试 —— 黄金路径「配对 → 连接 → 发消息 → 收到回复」
# 架构：真 relay_server（宿主机） + fake_desktop.py 回声机器人（宿主机）
#       + 真机 APK（API 29 模拟器） + Maestro 驱动 UI。
# 每周日 12:00 CST 定时跑 + 手动触发。
# 选型理由见 e2e/README.md（Maestro vs Espresso）。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # 周日 12:00 CST

env:
  E2E_ACCOUNT: e2e-room
  E2E_SECRET: e2e-secret
  E2E_RELAY_PORT: 8765

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build debug APK
        run: |
          cd android_app
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace
          ls app/build/outputs/apk/debug/*.apk

      - name: Start relay + fake desktop (host)
        run: |
          pip install "uvicorn[standard]" websockets
          cd relay_server
          nohup python3 server.py --port 8765 > /tmp/relay.log 2>&1 &
          echo $! > /tmp/relay.pid
          cd ..
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/stats > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/api/stats > /dev/null || { echo "relay 未启动"; cat /tmp/relay.log; exit 1; }
          echo "relay up"
          E2E_RELAY_URL="ws://127.0.0.1:8765" \
          nohup python3 e2e/fake_desktop.py > /tmp/fake-desktop.log 2>&1 &
          echo $! > /tmp/fake-desktop.pid
          sleep 3
          grep -q "auth 成功" /tmp/fake-desktop.log || { echo "fake desktop 未建房成功"; cat /tmp/fake-desktop.log; exit 1; }
          echo "fake desktop 已建房"

      - name: Write E2E test script
        run: |
          cat > /tmp/e2e-test.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          APK=$(ls android_app/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          # 模拟器 -> 宿主机 relay
          adb reverse tcp:8765 tcp:8765
          adb install -r "$APK"
          # 安装 Maestro
          export MAESTRO_CLI_NO_ANALYTICS=1
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          echo "=== 运行黄金路径 flow ==="
          E2E_ACCOUNT="e2e-room" E2E_SECRET="e2e-secret" E2E_RELAY_PORT="8765" \
            maestro test e2e/maestro/golden-path.yaml
          SCRIPT
          chmod +x /tmp/e2e-test.sh

      - name: Boot emulator and run golden path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          script: bash /tmp/e2e-test.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== relay ==="; tail -40 /tmp/relay.log || true
          echo "=== fake-desktop ==="; tail -40 /tmp/fake-desktop.log || true
