name: E2EE Integration (protocol-level)

# v4.3.1: E2EE 协议级联调 — 纯 Python，不依赖 Android 模拟器。
# mock_desktop（Python）+ mock_mobile（Python，镜像 Kotlin E2eeManager 逻辑）
# 验证：配对+HMAC验签、X25519密钥交换、HKDF密钥派生、ChaCha20-Poly1305加解密。
# Kotlin 侧加解密由单测覆盖（E2eeFailClosedTest、HMAC跨语言一致性测试）。
# 每周日 10:00 CST 定时跑 + 手动触发。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  e2ee-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install websocket-client cryptography fastapi "uvicorn[standard]"

      - name: Start relay
        run: |
          cd relay_server
          python3 server.py --port 8765 > /tmp/relay.log 2>&1 &
          echo $! > /tmp/relay.pid
          sleep 3
          curl -sf http://127.0.0.1:8765/api/stats > /dev/null && echo "relay up"
          # 调试：检查 WS 路由是否存在
          curl -s -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: test" http://127.0.0.1:8765/ws/test/desktop | head -5

      - name: Run E2EE protocol test
        run: |
          timeout 120 python3 tests/e2ee/e2ee_protocol_test.py
        # 成功输出 E2EE_PASS；失败输出 E2EE_FAIL 并以非零退出

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== relay ==="; tail -30 /tmp/relay.log
