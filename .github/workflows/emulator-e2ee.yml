name: E2EE Integration (protocol-level)

# v5.0.1: 本 workflow 改为跑「自包含」的 E2EE 协议测试。
# 原来的版本有两个问题：
#   1. 直接 `python3 server.py` 但没设 RELAY_ADMIN_TOKEN —— relay 自 v4.7.0 起
#      强制要求该变量（否则 SystemExit(2)），所以 relay 必然起不来、本 workflow 一直红。
#   2. 当时被测的 tests/e2ee/e2ee_protocol_test.py 自己复制了一份加密实现
#      （info/salt/AAD 都与真实实现不同），从不 import 真实模块 —— 真实 E2EE
#      全坏也会 PASS，属自欺型测试。
# 现在被测文件已重写为调用真实模块，且不再依赖 relay / websocket-client，
# relay 自身的启动与镜像另有 ci.yml 的 relay-image-smoke 覆盖。
# 每周日 10:00 CST 定时跑 + 手动触发。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

jobs:
  e2ee-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install cryptography

      - name: E2EE wire-format conformance (doc <-> Python <-> Kotlin)
        run: python3 tests/e2ee/e2ee_protocol_test.py

      - name: E2EE real-code chain + interop vectors
        run: |
          python3 desktop_agent/modules/test_e2ee.py
          python3 desktop_agent/modules/test_e2ee_v2.py

      - name: v5.0.1 hardening regressions
        run: python3 desktop_agent/modules/test_hardening.py
